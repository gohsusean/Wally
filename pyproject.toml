[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wally"
version = "0.16.0"
description = "Personal AI operating system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Sean Goh" }]
dependencies = [
    "openai>=1.68",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
browser = [
    "playwright>=1.49",
]

[project.scripts]
wally = "wally.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
